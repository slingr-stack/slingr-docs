# Meta Data for SEO

## Homepage
title = "Slingr"
titleSeparator = "-"
titleAddition = "Slingr Docs"
description = "Slingr Documentation"

## Documentation
# docsVersion = "0.3"

## Open Graph
images = ["slingr-docs-og.png"]
ogLocale = "en_US"
domainTLD = "platform-docs.slingr.io"
titleHome = "Slingr Docs"

## Twitter Cards
twitterSite = ""
twitterCreator = ""

## JSON-LD
# schemaType = "Person"
schemaType = "Organization"
schemaName = "Slingr"
schemaAuthor = "Slingr"
schemaAuthorTwitter = ""
schemaAuthorLinkedIn = "https://www.linkedin.com/company/slingr"
schemaAuthorGitHub = "https://github.com/slingr-stack"
schemaLocale = "en-US"
schemaLogo = "images/vendor/slingr-mark.png"
schemaLogoWidth = 400
schemaLogoHeight = 400
schemaImage = "slingr-docs-og.png"
schemaImageWidth = 1200
schemaImageHeight = 630
schemaTwitter = ""
schemaLinkedIn = "https://www.linkedin.com/company/slingr"
schemaGitHub = "https://github.com/slingr-stack"
schemaSection = "blog"

## Sitelinks Search Box
siteLinksSearchBox = true

## Chrome Browser
themeColor = "#fff"

# Images
quality = 85
bgColor = "#fff"
landscapePhotoWidths = [900, 800, 700, 600, 500]
portraitPhotoWidths = [800, 700, 600, 500]
lqipWidth = "20x"
smallLimit = "300"

# Images
imageResponsive = true
imageConvertTo = "webp"
imageImageSizes = ["480","720","1080","1280","1600","2048"]
singleSize = false
imageAddClass = "img-fluid lazyload blur-up"

# Edit Page
# repoHost [Github | Gitea | GitLab | Bitbucket | BitbucketServer ] is used for building the edit link based on git hoster
repoHost = "GitHub"
docsRepo = "https://github.com/slingr-stack/slingr-docs"
docsURL = "https://slingr-stack.github.io/slingr-docs"
docsRepoBranch = "main"
docsRepoSubPath = ""
editPage = true
lastMod = false

### Image template
defaultImage = "default-image.png" # put in `./assets/images/`
fillImage = "1270x740 Center" # normalize image size

# Footer
footer = "©2023 Slingr. All rights reserved. Site last generated: Sep 26, 2023"
# Feed
copyRight = "Copyright (c) 2020-2021 Henk Verlinde"

# Alert
alert = false
alertDismissable = true
# alertText = "Introducing the Doks child theme, several DX + UX updates, and more! <a class=\"alert-link stretched-link\" href=\"https://getdoks.org/blog/doks-v0.2/\" target=\"_blank\" rel=\"noopener\">Check out Doks v0.2</a>"
alertText = "Introducing the Doks child theme, several DX + UX updates, and more! <a class=\"alert-link stretched-link\" href=\"https://getdoks.org/blog/doks-v0.2/\">Check out Doks v0.2</a>"

[sections]
  sectionNav = ["docs", "guides"]

[options]
  lazySizes = true
  clipBoard = true
  instantPage = true
  flexSearch = true
  searchSectionsShow = []
  searchSectionsIndex = []
  darkMode = true
  bootStrapJs = true
  breadCrumb = false
  highLight = true
  kaTex = false
  multilingualMode = false
  docsVersioning = false
  fullWidth = false
  navbarSticky = true
  toTopButton = false
  scrollSpy = false # experimental; needs Bootstrap >= 5.2.0-beta1

[menu]
  [menu.section]
    auto = true
    collapsibleSidebar = true
